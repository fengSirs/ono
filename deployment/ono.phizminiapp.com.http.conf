server {
    listen 80;
    listen [::]:80;
    server_name ono.phizminiapp.com;
    root /opt/ono-finclip/current/deployment/public;
    client_max_body_size 1m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location = / { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location ~ ^/(?:healthz|v1(?:/|$)|assets/) {
        proxy_pass http://127.0.0.1:4390;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 25s;
    }
    location / { return 404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    access_log /www/wwwlogs/ono.phizminiapp.com.access.log;
    error_log /www/wwwlogs/ono.phizminiapp.com.error.log;
}
